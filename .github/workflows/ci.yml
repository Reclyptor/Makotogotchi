name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  Verify:
    # Not ubuntu-latest: its 24.04 image moved to kernel 7.0.0, and MongoDB 8.x
    # refuses to start on kernels 6.19 through 7.0.13 (SERVER-121912). The
    # 22.04 image is still on 6.8. Move back once the 24.04 kernel is 7.0.14+.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: End To End Tests
        run: npx playwright test
